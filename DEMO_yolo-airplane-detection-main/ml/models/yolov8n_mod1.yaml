# YOLOv8n модификация 1: удаление части 1 (верхний уровень FPN)
# Удаляем: H3 (Upsample), H4 (Concat), H5 (C2f)
# Оставляем только средний и нижний уровни детекции

nc: 1
depth_multiple: 0.33
width_multiple: 0.25

# Backbone (без изменений)
backbone:
  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4
  - [-1, 3, C2f, [128, True]]       # 2
  - [-1, 1, Conv, [256, 3, 2]]      # 3-P3/8
  - [-1, 6, C2f, [256, True]]       # 4
  - [-1, 1, Conv, [512, 3, 2]]      # 5-P4/16
  - [-1, 6, C2f, [512, True]]       # 6
  - [-1, 1, Conv, [1024, 3, 2]]     # 7-P5/32
  - [-1, 3, C2f, [1024, True]]      # 8
  - [-1, 1, SPPF, [1024, 5]]        # 9

# Head (модифицированный - без верхнего уровня FPN)
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 10
  - [[-1, 6], 1, Concat, [1]]                   # 11 cat backbone P4
  - [-1, 3, C2f, [512]]                         # 12

  - [-1, 1, Conv, [512, 3, 2]]                  # 13
  - [[-1, 9], 1, Concat, [1]]                   # 14 cat head P5
  - [-1, 3, C2f, [1024]]                        # 15

  - [[12, 15], 1, Detect, [nc]]                 # 16 Detect(P4, P5)

# YOLOv8n модификация 2: максимальное упрощение
# Удаляем все три части из задания:
# Часть 1 (синяя): верхний путь FPN - Upsample → Concat → C2f → Concat → C2f → Detect
# Часть 2 (фиолетовая): Conv в Neck (downsampling между уровнями детекции)
# Часть 3 (красная): последний блок Backbone - Conv P5/32 + C2f
# Результат: минимальная архитектура с одним уровнем детекции P3

nc: 1
depth_multiple: 0.33
width_multiple: 0.25

# Backbone (упрощенный - удалена Часть 3: Conv P5/32 + C2f)
backbone:
  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4
  - [-1, 3, C2f, [128, True]]       # 2
  - [-1, 1, Conv, [256, 3, 2]]      # 3-P3/8
  - [-1, 6, C2f, [256, True]]       # 4
  - [-1, 1, Conv, [512, 3, 2]]      # 5-P4/16
  - [-1, 6, C2f, [512, True]]       # 6
  - [-1, 1, SPPF, [512, 5]]         # 7

# Head (минимальный - удалены Часть 1 и Часть 2)
# Часть 1: весь верхний путь FPN отсутствует (только один уровень детекции)
# Часть 2: Conv для downsampling отсутствует (нет многоуровневой структуры)
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 8
  - [[-1, 4], 1, Concat, [1]]                   # 9 cat backbone P3
  - [-1, 3, C2f, [256]]                         # 10

  - [[10], 1, Detect, [nc]]                     # 11 Detect(P3)
